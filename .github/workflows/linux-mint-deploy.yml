name: Clean Deploy to Mint

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Fix permissions for checkout
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine chown -R $(id -u):$(id -g) /workspace || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare environment variables
        run: |
          # Copy example env files so containers have required variables
          cp fastapi_backend/.env.example fastapi_backend/.env

      # Only deploy. No tests to keep it clean.
      - name: Run with Docker Compose
        run: |
          docker compose down
          export NODE_ENV=production
          docker compose up --build -d
          docker image prune -f
          
      - name: Run Database Migrations
        run: docker compose exec -T backend alembic upgrade head
