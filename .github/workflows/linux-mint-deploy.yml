name: Clean Deploy to Mint

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Ensure Docker daemon persists across reboots
        run: |
          sudo systemctl enable docker
          sudo systemctl start docker

      - name: Fix permissions for checkout
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace || true"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare environment variables
        run: |
          cp fastapi_backend/.env.example fastapi_backend/.env

      - name: Backup database before deploy
        run: make docker-db-backup

      - name: Push backup to Google Drive
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backups:/backups:ro" \
            -v "$HOME/.config/rclone:/config/rclone:ro" \
            rclone/rclone:latest \
            sync /backups gdrive:db-backups --config /config/rclone/rclone.conf \
            && echo "Backup pushed to Google Drive" || echo "GDrive push failed — rclone not configured?"

      - name: Run with Docker Compose
        run: |
          docker compose down
          export NODE_ENV=production
          docker compose up --build -d
          docker image prune -f
          
      - name: Run Database Migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Start Google Drive sync service
        run: make docker-start-gdrive