name: Clean Deploy to Mint

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Fix permissions for checkout
        run: sudo chown -R $(id -u):$(id -g) ${{ github.workspace }} || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare environment variables
        run: |
          # Copy example env files
          cp fastapi_backend/.env.example fastapi_backend/.env
          cp nextjs-frontend/.env.example nextjs-frontend/.env

      - name: Backup database before deploy
        run: make db-backup

      - name: Push backup to Google Drive
        run: |
          make push-backup-to-gdrive

      - name: Install system dependencies
        run: make setup-system-deps

      - name: Setup PostgreSQL and run migrations
        run: make setup-postgres

      - name: Setup backend dependencies
        run: make setup-backend

      - name: Setup frontend dependencies and build
        run: make setup-frontend

      - name: Install systemd services (first run only)
        run: |
          if [ ! -f /etc/systemd/system/store-backend.service ]; then
            make install-systemd-services
          fi

      - name: Restart services
        run: make restart-services

      - name: Enable and start backup/sync timers
        run: make enable-timers