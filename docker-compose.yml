services:
  backend:
    build:
      context: fastapi_backend
    environment:
      - OPENAPI_OUTPUT_FILE=./shared-data/openapi.json
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/mydatabase
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:password@db:5433/testdatabase
      - MAIL_SERVER=mailhog
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8000:8000"
    networks:
      - my_network
    volumes:
      - ./fastapi_backend:/app
      - fastapi-venv:/app/.venv
      - ./local-shared-data:/app/shared-data
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5440:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdatabase
    ports:
      - "5441:5432"
    networks:
      - my_network
    restart: always
  frontend:
    build:
      context: ./nextjs-frontend
    user: node
    ports:
      - "3000:3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
      NEXT_PUBLIC_CURRENCY_SYMBOL: "\u20b2"
      NEXT_PUBLIC_CURRENCY_DECIMALS: "0"
    volumes:
      - ./nextjs-frontend:/app
      - nextjs-node-modules:/app/node_modules
      - ./local-shared-data:/app/shared-data
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - my_network
  db-backup:
    image: postgres:17
    environment:
      PGPASSWORD: password
    volumes:
      - ./backups:/backups
    networks:
      - my_network
    depends_on:
      - db
    restart: unless-stopped
    entrypoint: >
      sh -c "
        echo 'Backup service started. First backup in 1 min, then every 24h.';
        sleep 60;
        while true; do
          FILE=/backups/$$(date +%Y-%m-%d_%H%M%S).dump;
          pg_dump -h db -U postgres -Fc mydatabase > $$FILE && echo \"Backup saved: $$FILE\" || echo 'Backup FAILED';
          ls -t /backups/*.dump 2>/dev/null | tail -n +8 | xargs rm -f;
          sleep 86400;
        done
      "
  gdrive-sync:
    image: rclone/rclone:latest
    volumes:
      - ./backups:/backups:ro
      - ${HOME}/.config/rclone:/config/rclone:ro
    restart: unless-stopped
    entrypoint: >
      sh -c "
        echo 'Google Drive sync started. Syncing every hour.';
        while true; do
          if rclone lsd gdrive: --config /config/rclone/rclone.conf > /dev/null 2>&1; then
            rclone sync /backups gdrive:db-backups --config /config/rclone/rclone.conf && echo \"Synced to Google Drive\" || echo 'Sync FAILED';
          else
            echo 'rclone remote \"gdrive\" not configured. Run: make setup-gdrive';
          fi;
          sleep 3600;
        done
      "
    profiles:
      - gdrive

volumes:
  postgres_data:
  nextjs-node-modules:
  fastapi-venv:

networks:
  my_network:
    driver: bridge